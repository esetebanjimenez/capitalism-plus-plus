name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: |
          ruff check src tests
          ruff format --check .
      - name: Rules doc up to date
        run: python scripts/generate_rules_md.py --check
      - name: Test
        run: pytest -q

  pyodide-smoke:
    name: pyodide-smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install
        run: |
          pip install -e ".[dev]"
          npm install --prefix web
      - name: Sim loads and runs under Pyodide
        run: pytest -q tests/test_pyodide_smoke.py

  client:
    name: client
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install
        run: npm ci --prefix client
      - name: Typecheck, unit tests, build
        run: npm run --prefix client check
