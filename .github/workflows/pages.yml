name: pages

# Deploys the client to GitHub Pages on every push to main, so it can be opened on a real
# phone. The build carries the sim (capitalism.zip) and a self-hosted Pyodide with its
# wheels (#247), and is boot-checked before it ships. URL options work as locally,
# e.g. ?map=sample&mode=direct&art=64&chunk=16.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci --prefix client
      - run: npm run --prefix client build
      - name: Boot check (sim boots, 10 days pass)
        run: npm run --prefix client boot-check
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: client/dist
      - id: deployment
        uses: actions/deploy-pages@v4
