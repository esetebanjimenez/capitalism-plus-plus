[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "capitalism-plus-plus"
version = "0.1.0"
description = "Capitalism++: a modern take on the 90s business sim Capitalism"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
capitalism = "capitalism.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/capitalism"]

[tool.hatch.build.targets.wheel.force-include]
"src/capitalism/data" = "capitalism/data"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
